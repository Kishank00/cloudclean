name: CloudClean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # Version comes from .python-version (3.13)
      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      # Tests use fake AWS clients, so no AWS credentials are needed
      - name: Run tests
        run: uv run pytest -v
